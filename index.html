<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资情报台</title>
<style>body{margin:0;background:#0c1220;color:#e8eef9;font:16px system-ui;padding:32px}main{max-width:1200px;margin:auto}h1{font-size:32px}.muted{color:#95a5bf}section{background:#151e30;border:1px solid #29354b;border-radius:16px;padding:22px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #29354b}a{color:#83c7ff}li{margin:14px 0}.bad{color:#ffbc79}button{background:#2267ce;color:white;border:0;border-radius:8px;padding:10px 18px}</style>
<main><h1>投资情报台</h1><p class="muted">美股 · 数字货币 · A股｜可追溯行情与新闻</p><button onclick="load()">刷新看板</button><p id="time"></p><section><h2>自选行情</h2><p class="muted">价格以供应商成交时间为准。过期数据不会标为实时；IEX 为单一交易所覆盖。</p><table><thead><tr><th>市场 / 标的</th><th>价格</th><th>数据时间</th><th>状态</th><th>来源</th></tr></thead><tbody id="quotes"></tbody></table></section><section><h2>重要资讯</h2><p class="muted">点击原文核实。第一版按发布时间排序，AI影响评估尚未启用。</p><ul id="news"></ul></section><p class="muted" id="gaps"></p></main>
<script>function cell(row,value){let x=document.createElement('td');x.textContent=value??'—';row.append(x)}async function load(){try{let d=await(await fetch('/api/snapshot')).json();document.getElementById('time').textContent='刷新时间：'+(d.generated_at||'正在采集');let q=document.getElementById('quotes');q.replaceChildren();for(let p of d.quotes){let r=document.createElement('tr');cell(r,p.market+' / '+p.symbol);cell(r,p.price);cell(r,p.as_of);cell(r,p.freshness||p.reason||p.status);cell(r,p.source?.provider);if(p.status!=='available')r.className='bad';q.append(r)}let n=document.getElementById('news');n.replaceChildren();for(let p of d.news){let li=document.createElement('li'),a=document.createElement('a');a.textContent=p.title;a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a,document.createTextNode(' · '+p.source+' · '+(p.published_at||'时间未知')));n.append(li)}document.getElementById('gaps').textContent='数据缺口：'+(d.data_gaps.join(', ')||'无')}catch{document.getElementById('time').textContent='后台连接失败'}}load();setInterval(load,15000)</script></html>
